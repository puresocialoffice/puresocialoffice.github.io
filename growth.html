<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Heebo',Arial,sans-serif;background:#0a0a0a;color:#fff;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:24px 16px 60px}
.hero{background:radial-gradient(500px 300px at 0% 0%,rgba(255,110,30,.25),transparent 70%),#0f0f0f;border:1px solid #222;border-radius:22px;padding:24px 22px}
.logo{height:36px;display:block}
.kick{margin-top:22px;color:#cfcfcf;font-size:16px}
.pkg{direction:ltr;text-align:right;font-weight:900;line-height:1;margin-top:6px}
.pkg .a{font-size:30px;letter-spacing:4px;display:block}
.pkg .b{font-size:52px;background:linear-gradient(135deg,#FFA21A,#FF3D2E);-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block;padding:0 2px}
.price{margin-top:18px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.price b{font-size:40px;font-weight:900}
.price span{color:#cfcfcf;font-size:15px}
.vat{display:inline-block;background:linear-gradient(135deg,#FFA21A,#FF3D2E);color:#111;font-weight:700;font-size:12.5px;border-radius:99px;padding:3px 10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}
.stat{background:#151515;border:1px solid #262626;border-radius:14px;padding:10px 12px;border-bottom:3px solid #FF6A26}
.stat .n{font-size:26px;font-weight:900;color:#FF8A24;direction:ltr;text-align:right}
.stat .t{font-size:13.5px;font-weight:700}
h2{font-size:14px;letter-spacing:2px;color:#FF8A24;margin:26px 4px 10px}
.inc{list-style:none;display:grid;gap:8px;padding:0 4px}
.inc li{display:flex;gap:10px;align-items:flex-start;font-size:15.5px;line-height:1.45}
.ck{width:20px;height:20px;border-radius:50%;flex:none;background:linear-gradient(135deg,#FFA21A,#FF3D2E);display:flex;align-items:center;justify-content:center;margin-top:1px}
details{background:#f7f5f2;color:#1b1b1b;border-radius:16px;margin-top:10px;overflow:hidden}
summary{cursor:pointer;padding:14px 18px;font-weight:700;font-size:16px;list-style:none;display:flex;justify-content:space-between}
summary::-webkit-details-marker{display:none}
summary:after{content:"+";color:#FF6A26;font-size:20px;line-height:1}
details[open] summary:after{content:"–"}
.terms{padding:0 18px 16px}
.terms h3{font-size:15.5px;margin:12px 0 6px;display:flex;gap:8px;align-items:center}
.terms h3:before{content:"";width:8px;height:8px;border-radius:2px;background:#FF6A26}
.terms li{font-size:14.5px;line-height:1.6;margin-right:18px;color:#333}
.card{background:#121212;border:1px solid #262626;border-radius:18px;padding:18px}
label{display:block;font-size:14px;color:#bbb;margin:12px 0 5px}
label:first-child{margin-top:0}
input[type=text],input[type=email],input[type=tel]{width:100%;background:#1b1b1b;border:1px solid #333;border-radius:12px;color:#fff;font:inherit;font-size:16px;padding:12px 14px;outline:none}
input:focus{border-color:#FF8A24}
.sigbox{position:relative;background:#fff;border-radius:14px;height:190px;touch-action:none;overflow:hidden}
canvas{width:100%;height:100%;display:block;touch-action:none}
.sighint{position:absolute;inset:auto 0 12px 0;text-align:center;color:#aaa;font-size:13px;pointer-events:none}
.sigline{position:absolute;left:24px;right:24px;bottom:40px;border-top:1.5px dashed #ccc;pointer-events:none}
.clear{background:none;border:none;color:#FF8A24;font:inherit;font-size:14px;margin-top:8px;cursor:pointer}
.agree{display:flex;gap:10px;align-items:flex-start;margin-top:16px;font-size:14.5px;line-height:1.5;color:#ddd}
.agree input{width:20px;height:20px;accent-color:#FF6A26;flex:none;margin-top:2px}
.btn{width:100%;margin-top:18px;border:none;border-radius:14px;padding:16px;font:inherit;font-size:18px;font-weight:900;color:#111;background:linear-gradient(135deg,#FFA21A,#FF3D2E);cursor:pointer}
.btn:disabled{opacity:.5}
.err{color:#ff6b5a;font-size:14px;margin-top:10px;min-height:1em}
.done{text-align:center;padding:60px 20px}
.done .big{width:76px;height:76px;border-radius:50%;margin:0 auto 18px;background:linear-gradient(135deg,#FFA21A,#FF3D2E);display:flex;align-items:center;justify-content:center}
.done h1{font-size:30px;font-weight:900}
.done p{color:#cfcfcf;margin-top:10px;line-height:1.6}
.foot{text-align:center;color:#666;font-size:12px;margin-top:26px}
.bad{text-align:center;padding:80px 20px;color:#ccc}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
var DATA = {"pkg":{"name":"GROWTH","price":"8,000","stats":[["5","סרטונים"],["3","פוסטים מעוצבים"],["1-2","ימי צילום"]],"items":["5 סרטונים בחודש","3 פוסטים מעוצבים בחודש","1–2 ימי צילום בחודש, בדגש על מהות העסק","אסטרטגיה שיווקית שנתפרת במיוחד לבעל העסק","עריכה של כל התכנים המצולמים ועיצוב הפוסטים","העלאת התכנים בהתאם לאופי של כל רשת (רילס, קרוסלות, פוסטים וכו׳)","ניהול עמודים (למעט מענה ללקוחות)","ניהול קמפיינים ממומנים","ניתוח ביצועים"]},"terms":[["כללי",["חברת פיור סושיאל (PURE SOCIAL). הלקוח המזמין שירות מטעם ״פיור סושיאל״ ייקרא להלן ״המזמין״.","המסלול הנבחר הוא בהתאם להצעת המחיר המקורית שנשלחה למזמין.","במסלול זה המזמין מתחייב ל-3 חודשי עבודה של אספקת שירות מטעם ״פיור סושיאל״.","כלל הרשתות המובילות הן טיקטוק, אינסטגרם, פייסבוק ויוטיוב.","העלאות לפייסבוק יתבצעו במידה וחשבון ה-Meta מקושר לשתי הפלטפורמות."]],["צילומים",["הצילומים מתבצעים במסגרת החבילה של אותו החודש, באותו החודש.","ביטול של צילומים שבמסגרת החבילה החודשית, מסיבה כלשהי, באחריות המזמין בלבד.","בהגעת צלם מטעם החברה אל המזמין, מומלץ להצמיד עובד מטעם העסק של המזמין. בכל מקרה אחר החברה רשאית לייצר מדיה לפי דעתה.","אם ישנן ישויות ו/או מקומות שאסור לצלם, המזמין מחויב ליידע את החברה מראש."]],["העלאות",["העלאות מתבצעות בימים ראשון עד חמישי, בין השעות 08:00 ל-18:00, ללא ערבי חג, ללא חגים, ללא ימי שישי ושבת."]],["שינויים",["כל שינוי בתוכנית עלול להביא לשינוי במחירים ובלוחות הזמנים המפורטים לעיל, ואף כפוף להסכמת החברה ולאישור הזמנה מעודכנת חדשה."]],["אחריות",["כל נזק הנגרם לנכסים הדיגיטליים של המזמין (פריצות, מחיקות או חסימות של סרטונים/פרופילים ו/או עמודים ברשתות החברתיות) ו/או לעסק ו/או לכל אדם מטעם העסק של המזמין, הוא באחריות המזמין בלבד. למזמין לא תהיה כל טענה ו/או דרישה כלפי החברה בעניין זה.","כל נזק הנגרם לאחר ביצוע העבודה יהיה באחריות המזמין."]],["ביטול העסקה",["ביטול העסקה מטעם המזמין כרוך ב-15% מסך העסקה הכוללת. ניתן לבטל בשוטף חודש לפני סיום העבודה, כלומר בסמוך לתשלום האחרון.","החברה רשאית לבטל את העסקה בכל עת על פי דעתה. במקרה של ביטול, החברה תזכה את המזמין בחלק היחסי של אותו החודש.","במידה וקרה משהו חמור לעסק של המזמין מכוחות בלתי נשלטים, החברה רשאית לבטל את העסקה/הצילומים ללא דמי ביטול."]],["תשלום ותנאי גבייה",["מחירי המסלולים הם לתקופה של חודש עבודה, והמחירים המוצגים אינם כוללים מע״מ.","התשלום עבור השירותים יבוצע באמצעות חיוב חודשי אוטומטי בכרטיס אשראי או באמצעי תשלום מאושר אחר, וייגבה מראש עבור חודש השירות הקרוב.","מועד החיוב הקבוע הינו ה-1 לכל חודש, אלא אם סוכם אחרת בכתב בין הצדדים.","לקוח המצטרף במהלך חודש קלנדרי יחויב במעמד ההצטרפות בתשלום מלא עבור חודש השירות הראשון. החיוב החודשי האוטומטי יחל במועד החיוב הקבוע הראשון שלאחר סיום חודש השירות הראשון, ולאחר מכן ימשיך להתבצע אחת לחודש בהתאם לתנאי ההתקשרות.","הלקוח מאשר לחברה לבצע חיובים חוזרים בהתאם לתנאי ההתקשרות ומתחייב לשמור על אמצעי תשלום תקף לאורך כל תקופת ההסכם.","במקרה של כשל בחיוב, תינתן ללקוח תקופה של עד 5 ימי עסקים להסדרת התשלום. ככל שהתשלום לא יוסדר בפרק זמן זה, תהא החברה רשאית להשהות את השירותים עד להסדרת התשלום במלואו.","מובהר כי שמירת מועדי צילום, הקצאת משאבים ומתן השירותים כפופים לעמידת הלקוח בתנאי התשלום כמפורט לעיל.","השהיית השירות עקב אי-הסדרת תשלום לא תיחשב כהפרת הסכם מצד החברה."]],["הסכמה",["על כן באו שני הצדדים בהסכמה מלאה. חתימה דיגיטלית כמוה כחתימה רגילה."]]],"logo":"logo.png","api":"https://script.google.com/macros/s/AKfycbww1-30BZ_xxqYwmNehPS7bcQ4UOzr0Ip34h1xIrjfNvO446ddTpNs5-BEP4gizgmbX/exec"};
var CK = '<svg viewBox="0 0 24 24" width="12" height="12"><path d="M5 12.5l4.2 4.2L19 7" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var app = document.getElementById('app');
if (!DATA.pkg) {
  app.innerHTML = '<div class="bad"><img class="logo" style="margin:0 auto 20px" src="'+DATA.logo+'"><p>הקישור אינו תקין. נא לפנות לפיור סושיאל לקבלת קישור חדש.</p></div>';
} else {
  var p = DATA.pkg;
  var h = '';
  h += '<div class="hero"><img class="logo" src="'+DATA.logo+'">';
  h += '<div class="kick">הסכם התקשרות · מסלול ליווי 3 חודשים</div>';
  h += '<div class="pkg"><span class="a">PURE</span><span class="b">'+p.name+'</span></div>';
  h += '<div class="price"><b>'+p.price+' ₪</b><span>לחודש · כולל ניהול קמפיינים ממומנים</span><span class="vat">לא כולל מע״מ</span></div>';
  h += '<div class="stats">'+p.stats.map(function(s){return '<div class="stat"><div class="n">'+s[0]+'</div><div class="t">'+s[1]+'</div></div>'}).join('')+'</div></div>';
  h += '<h2>מה כלול במסלול</h2><ul class="inc">'+p.items.map(function(i){return '<li><span class="ck">'+CK+'</span><span>'+i+'</span></li>'}).join('')+'</ul>';
  h += '<h2>תנאי ההתקשרות</h2>';
  DATA.terms.forEach(function(t,ix){
    h += '<details'+(ix===0?' open':'')+'><summary>'+t[0]+'</summary><div class="terms"><ul>'+t[1].map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul></div></details>';
  });
  h += '<h2>פרטי המזמין וחתימה</h2><div class="card">';
  h += '<label>שם מלא *</label><input type="text" id="name" autocomplete="name">';
  h += '<label>שם העסק *</label><input type="text" id="biz" autocomplete="organization">';
  h += '<label>ת.ז / ח.פ / ע.מ *</label><input type="text" id="idn" inputmode="numeric">';
  h += '<label>טלפון *</label><input type="tel" id="phone" autocomplete="tel">';
  h += '<label>אימייל (לקבלת עותק חתום) *</label><input type="email" id="email" autocomplete="email" dir="ltr">';
  h += '<label>חתימה *</label><div class="sigbox"><canvas id="sig"></canvas><div class="sigline"></div><div class="sighint" id="hint">חתמו כאן עם האצבע או העכבר</div></div>';
  h += '<button class="clear" id="clr" type="button">ניקוי חתימה</button>';
  h += '<label class="agree"><input type="checkbox" id="ok"><span>קראתי את פרטי המסלול ואת תנאי ההתקשרות, ואני מאשר/ת אותם. ידוע לי כי המחירים אינם כוללים מע״מ.</span></label>';
  h += '<button class="btn" id="go">אישור וחתימה</button><div class="err" id="err"></div></div>';
  h += '<div class="foot">PURE SOCIAL · מסמך זה נחתם באופן דיגיטלי ועותק חתום יישלח לשני הצדדים</div>';
  app.innerHTML = h;

  var cv = document.getElementById('sig'), ctx, drawing = false, dirty = false;
  function size(){var r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;ctx=cv.getContext('2d');ctx.scale(d,d);ctx.lineWidth=2.6;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#111';dirty=false;document.getElementById('hint').style.display='';}
  size();
  function pos(e){var r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
  cv.addEventListener('pointerdown',function(e){drawing=true;cv.setPointerCapture(e.pointerId);var q=pos(e);ctx.beginPath();ctx.moveTo(q.x,q.y);ctx.lineTo(q.x+.1,q.y+.1);ctx.stroke();dirty=true;document.getElementById('hint').style.display='none';e.preventDefault()});
  cv.addEventListener('pointermove',function(e){if(!drawing)return;var q=pos(e);ctx.lineTo(q.x,q.y);ctx.stroke();e.preventDefault()});
  ['pointerup','pointercancel','pointerleave'].forEach(function(t){cv.addEventListener(t,function(){drawing=false})});
  document.getElementById('clr').onclick=size;

  document.getElementById('go').onclick=function(){
    var v=function(id){return document.getElementById(id).value.trim()};
    var err=document.getElementById('err'); err.textContent='';
    var f={pkg:p.name,name:v('name'),biz:v('biz'),idn:v('idn'),phone:v('phone'),email:v('email'),ua:navigator.userAgent};
    if(!f.name||!f.biz||!f.idn||!f.phone||!f.email){err.textContent='נא למלא את כל השדות המסומנים בכוכבית.';return}
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(f.email)){err.textContent='כתובת האימייל אינה תקינה.';return}
    if(!dirty){err.textContent='נא לחתום בתיבת החתימה.';return}
    if(!document.getElementById('ok').checked){err.textContent='נא לאשר את תנאי ההתקשרות.';return}
    f.sig=cv.toDataURL('image/png');
    var b=this; b.disabled=true; b.textContent='שולח...';
    var onOk = function(r){
      window.scrollTo(0,0);
      app.innerHTML='<div class="done"><div class="big"><svg viewBox="0 0 24 24" width="38" height="38"><path d="M5 12.5l4.2 4.2L19 7" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div><h1>ההסכם נחתם בהצלחה</h1><p>תודה '+esc(f.name)+'!<br>עותק חתום של ההסכם נשלח לכתובת '+esc(f.email)+'.<br>מספר הסכם: '+esc(r.id)+'</p><p style="margin-top:22px">נתראה בצילומים 🧡<br>צוות PURE SOCIAL</p></div>';
    };
    var onErr = function(e){b.disabled=false;b.textContent='אישור וחתימה';err.textContent='אירעה שגיאה בשליחה, נא לנסות שוב. ('+(e&&e.message||e)+')';};
    if (window.google && google.script && google.script.run) {
      google.script.run.withSuccessHandler(onOk).withFailureHandler(onErr).submitContract(f);
    } else {
      fetch(DATA.api, {method:'POST', body:JSON.stringify(f), headers:{'Content-Type':'text/plain;charset=utf-8'}, credentials:'omit', redirect:'follow'})
        .then(function(res){return res.json()})
        .then(function(r){ if(r && r.ok) onOk(r); else onErr(new Error(r && r.error || 'שגיאה')); })
        .catch(onErr);
    }
  };
}
</script>
</body>
</html>
